name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 聊天面板与打招呼的单测（不依赖原生 Helper / Python）
        run: |
          node --test test/chat.test.mjs test/greeter.test.mjs
